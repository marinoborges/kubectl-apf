apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: apf
spec:
  version: {{ .TagName }}
  homepage: https://github.com/marinoborges/kubectl-apf
  shortDescription: Show APF priority levels and flow schemas
  description: |
    Lists PriorityLevelConfiguration and FlowSchema objects, and reads the
    in-memory API Priority and Fairness snapshots for queues and requests.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-apf
    files:
    - from: kubectl-apf
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-apf
    files:
    - from: kubectl-apf
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_linux_armv6.tar.gz" .TagName }}
    bin: kubectl-apf
    files:
    - from: kubectl-apf
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-apf
    files:
    - from: kubectl-apf
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-apf
    files:
    - from: kubectl-apf
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_windows_amd64.zip" .TagName }}
    bin: kubectl-apf.exe
    files:
    - from: kubectl-apf.exe
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/marinoborges/kubectl-apf/releases/download/{{ .TagName }}/kubectl-apf_windows_arm64.zip" .TagName }}
    bin: kubectl-apf.exe
    files:
    - from: kubectl-apf.exe
      to: .
    - from: LICENSE
      to: .
